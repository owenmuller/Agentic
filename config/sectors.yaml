# Sector mapping for the risk gate's concentration guard (2026-08-19).
#
# HUMAN-EDITABLE, static, deterministic. The gate caps aggregate equity exposure
# per sector (equity_sleeve.max_sector_exposure in risk_limits.yaml). A ticker
# not listed here is treated as its OWN singleton sector ("unmapped:XYZ") — an
# unknown name must never silently share a bucket with anything else, so the
# per-sector cap degrades to a per-name cap until a human classifies it.
#
# Covers the current watchlist universe: names the signal sources actually
# surface (policy-theme plays, congressional favourites, 13F concentrations).
# Extend freely; a ticker may appear in exactly one sector.


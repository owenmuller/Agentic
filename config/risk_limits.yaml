# Risk limits — mirrors the caps in CLAUDE.md.
#
# Changing ANY value in this file requires explicit human approval
# (CLAUDE.md § Requires Explicit Human Approval). The risk gate loads this file and
# treats it as binding; it is not a set of defaults to tune.

version: 1

account:
  cash_secured_only: true
  margin_enabled: false
  short_selling: forbidden
  option_writing: forbidden # also structurally unrepresentable in the order schema

portfolio:
  # Allocation ruling (2026-08-21, human-authorized): 100/0 until a prediction-market
  # venue actually exists — the 10% sleeve has no execution path (Robinhood event
  # contracts are roadmap-only, Kalshi is Plan B behind the paper gate), and NAV
  # reserved for an unexecutable sleeve is dead capital. The 90/10 design target,
  # rebalance logic, and prediction-sleeve caps below all stay: restoring 90/10 when
  # a venue ships is a config flip — and itself a human ruling (CLAUDE.md
  # § Requires Explicit Human Approval).
  # Amendment (human ruling 2026-08-27): 75/25/0 — the mechanical disclosure
  # follower runs as its own sleeve, a controlled experiment alongside the
  # judged system. Restoring the prediction sleeve when a venue ships remains
  # its own human ruling and will re-cut these weights.
  sleeves:
    equity: 0.75 # the JUDGED sleeve: equities & long options
    mechanical: 0.25 # deterministic disclosure follower — no LLM in the path
    prediction: 0.00 # event contracts — INACTIVE, no venue (design target: 0.10)
  drift_tolerance: 0.03 # +/-3% from target triggers rebalance
  rebalance: weekly_at_next_session_open

equity_sleeve:
  max_single_position: 0.05 # of sleeve NAV
  max_daily_deployment: 0.15 # of sleeve NAV, per trading day
  max_options_premium_at_risk: 0.20 # aggregate open premium, of equity sleeve
  # Concentration guard (2026-08-19): aggregate equity exposure per sector, of
  # sleeve NAV. Sector membership comes from the static human-editable table in
  # config/sectors.yaml; an unmapped ticker is its own singleton sector.
  max_sector_exposure: 0.15
  # Fractional shares (2026-08-20): smallest opening equity order, in dollars. A
  # computed position below this floor is a typed rejection (below_min_notional),
  # not a dust order. Opening equity orders only — closes are never floor-blocked.
  min_order_notional_usd: 5

kill_switch:
  drawdown_from_high_water_mark: 0.12
  halts: all_new_orders
  reset: manual_human_only

pdt:
  equity_threshold_usd: 25000
  enforce_day_trade_count_in_margin_account: true
  preferred_account_type: cash # also structurally prevents a negative balance

sizing:
  # Research confidence (0-100) -> position size as a fraction of sleeve NAV.
  #
  # BOUNDARY RULE: CLAUDE.md lists the bands as "55-70 / 70-85 / 85+", which overlaps
  # at 70 and at 85. Resolved per Inviolable Constraint #6 (ambiguity resolves toward
  # less risk): bands are (lower, upper], so a confidence landing exactly on a boundary
  # takes the SMALLER size. Exactly 70 -> 1.0%, exactly 85 -> 2.5%.
  #
  # The one exception is the floor: "< 55 | No trade" is explicit, not ambiguous, so
  # 55 itself trades at 1.0% and the first band alone is lower-inclusive. Constraint #6
  # resolves genuine overlaps; it does not override a rule that already says what it
  # means.
  no_trade_below: 55
  bounds: lower_exclusive_upper_inclusive
  bands:
    - { min: 55, max: 70, size: 0.010, lower_inclusive: true }
    - { min: 70, max: 85, size: 0.025 }
    - { min: 85, max: 100, size: 0.050 }
  hard_cap: 0.05 # confidence 100 is still 5% max
  options:
    basis: premium_at_risk
    multiplier: 0.5 # table size halved: options already carry embedded leverage

# The mechanical disclosure follower (human ruling 2026-08-27). Qualification
# is DELIBERATELY identical to the judged prefilter (same signals.yaml rules,
# same code path) — the experiment varies only judgment and exits, and the
# funnels must never diverge. These are the sleeve's own caps.
mechanical_sleeve:
  max_single_position: 0.05 # of mechanical sleeve NAV — gate backstop
  max_daily_deployment: 0.15 # of mechanical sleeve NAV, its own daily budget
  max_sector_exposure: 0.30 # gate backstop; the slot cap below is primary
  max_positions: 30 # equal-weight slots; slice = sleeve NAV / 30
  max_per_filer: 6 # one member's filing spree is not a portfolio
  max_per_sector_slots: 8 # of 30, mapped sectors; unmapped names = singletons
  hold_days: 365 # time exit only — no price stop; the stop IS the slice size
  drawdown_halt_fraction: 0.25 # sleeve circuit breaker vs its OWN high-water mark
  ruleset_version: "2026-08-27.1"

prediction_sleeve:
  arbitrage:
    max_position: 0.005 # of prediction sleeve, per arb position
    fee_clearance_multiplier: 1.5 # edge > (round_trip_fees + slippage) * 1.5
    fees_source: live_fee_schedule # never assumed, computed per contract on both legs
    high_turnover_expected: true
  directional:
    min_divergence_points: 10 # research probability vs market-implied odds
    max_position: 0.02 # of prediction sleeve, per position

# Options instrument selection (human ruling 2026-08-24): deterministic contract
# choice for catalyst-backed theses. Leverage is earned by timing specificity;
# every threshold here fails toward the equity expression.
options_selection:
  min_expiry_days: # shortest expiry >= this, by report time horizon (~2x rule)
    days: 14
    weeks: 60
    months: 180
  delta_bands: # confidence -> |delta| range; boundaries take the deeper-ITM band
    - { min: 55, max: 70, delta_min: 0.70, delta_max: 0.85, lower_inclusive: true }
    - { min: 70, max: 85, delta_min: 0.60, delta_max: 0.75 }
    - { min: 85, max: 100, delta_min: 0.50, delta_max: 0.65 }
  min_delta_floor: 0.45 # never OTM lottery strikes, any band
  min_open_interest: 500
  max_spread_pct_of_mid: 0.10
  max_iv_percentile: 0.90 # vs the fetched chain's own IV distribution
  close_before_expiry_days: 5 # theta endgame is not a place this system holds

execution:
  default_order_type: limit
  market_orders_require_justification: true

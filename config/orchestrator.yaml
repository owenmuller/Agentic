# Orchestrator loop configuration.
#
# Nothing in this file can widen a risk limit. The caps live in risk_limits.yaml and
# are enforced downstream of everything the loop does; these values control how often
# the loop wakes up and how much research it is willing to buy in a day.

version: 1

# COST CEILING. The research layer is the only part of this system that spends money
# per signal, and a noisy day on a Class 1 feed can produce a great many signals. When
# this many passes have been bought in a day, further signals queue unresearched until
# the next day rather than being dropped — they are still there tomorrow, they are just
# not worth an unbounded spend today.
#
# Derived from the log rather than from a counter, so a restart cannot buy the budget a
# second time. See audit.log.AuditLog.research_passes_on.
max_research_passes_per_day: 40

# RESERVE FOR THE EXIT LAYER (ruling 2026-08-31). Entries may spend at most
# (1 - this) of the day's passes, so reviews of open positions can never be starved
# by a noisy entry feed. Reviews may use the whole remainder, including the entry
# share nobody claimed — the reserve is a floor under reviews, not a cap on them.
review_budget_reserve_fraction: 0.25

# COST TRIPWIRE. Same pattern as the X reads counter: when a day's cumulative
# estimated research spend (entry passes + exit reviews, rejected passes included
# because they were paid for) crosses this many dollars, ONE COST warning line is
# written to run.log — once per day, not per pass. Estimates come from the pricing
# table in research.yaml; the console bill is the truth this warns ahead of.
daily_cost_warning_usd: 10

# How often the loop wakes. Each scanner still polls on its own cadence from
# signals.yaml — this only has to be fast enough not to be the binding constraint on
# the fastest of them (Class 1, 60s).
tick_interval_seconds: 30

# cash | margin. risk_limits.yaml states `pdt.preferred_account_type: cash`, and a cash
# account cannot be a pattern day trader — it is also what structurally prevents a
# negative balance (Constraint #1). Set to `margin` only if the broker account really is
# one, which turns on day-trade counting in the risk gate below $25K equity.
account_type: cash

# EXIT LOGIC. Two layers (see src/orchestrator/exits.py):
#
#   1. Deterministic guardrails, no LLM, checked every loop cycle: a max-loss stop and
#      a time stop, both fixed per-position at entry from the defaults below. These are
#      the guarantee — they run whether or not the review layer works.
#   2. Thesis review: a periodic LLM re-research of each open position (hold/close via
#      a closed schema). Counts against max_research_passes_per_day above. A failed
#      review is a hold, never a close — the guardrails still apply regardless.
#
# Both stops resolve boundaries toward the exit (Constraint #6): a price exactly at
# the stop closes, a holding period exactly at the leash closes.
exits:
  # Close when price falls to or below entry_price x (1 - this). Per position, frozen
  # at entry. 0.15 on a 5%-of-sleeve position bounds the loss at 0.75% of the sleeve.
  max_loss_fraction: 0.15

  # FALLBACK maximum holding period, by the research report's time_horizon. The
  # PRIMARY leash source is the report's own expected_resolution_date (ruling
  # 2026-08-31); this is what a report that states no date gets. A thesis that has
  # not worked within its own stated horizon was wrong about something, whichever
  # direction price went.
  time_stop_days:
    days: 7
    weeks: 45
    months: 120

  # Bounds every leash is clamped into, whatever its source — the entry report's
  # date, a review's revision, or the fallback above. MEASURED FROM ENTRY, never
  # from the review asking: a ceiling measured from "now" is not a ceiling.
  # The months ceiling matches the mechanical arm's hold deliberately, so the
  # leash stays out of the two-arm comparison. Both moved 365 -> 367 in the same
  # ruling (2026-09-02): long-term tax treatment needs MORE than one year, trade
  # date to trade date, and 367 carries a one-day cushion over the boundary.
  leash_bounds:
    days: { floor: 3, ceiling: 21 }
    weeks: { floor: 14, ceiling: 90 }
    months: { floor: 60, ceiling: 367 }

  # How often each open position gets a thesis review. Reviews spend the daily
  # research budget, but 25% of it is reserved for them (see
  # review_budget_reserve_fraction) so entries cannot starve the exit layer.
  thesis_review_interval_hours: 24

  # A price move that forces a review out of cadence. The trigger sets a flag and
  # nothing else — it never closes a position. Asymmetric on purpose: a downside
  # trigger at the 15% stop distance would fire in the same cycle the stop closes
  # the position, so it sits tighter and asks "is the thesis dead?" while there is
  # still a decision to make. Debounced from the last review's price.
  review_trigger:
    up_fraction: 0.15
    down_fraction: 0.10
    max_per_day: 5

  # The trailing backstop beneath the review layer. Arms only after a gain that has
  # already happened, then follows the position's high-water mark and never falls.
  # Not a profit target: it cannot fire on a position that has not first run.
  ratchet:
    arm_at_gain: 0.20
    trail_fraction: 0.10

  # EXIT-AUTHORITY PROBATION (human ruling 2026-09-02, from live LLM-agent
  # evidence that review layers over-fire profit-taking closes). For 90 days a
  # review CLOSE verdict on a position that is BOTH profitable AND
  # validity-intact is SHADOWED - written to the audit log (ShadowCloseRecord)
  # with the mark, never executed. Stops, ratchet, leash, and invalidation
  # retain FULL authority throughout, and a close on an invalidated or
  # displaced thesis still executes. The forward engine grades every shadow
  # (what did the price do after the model said sell?); the grant/deny ruling
  # at the window's end reads that evidence with n>=20. Delete this block to
  # restore full close authority - which is itself the ruling this measures.
  review_close_probation:
    start_date: 2026-09-02
    days: 90

  # The TRIM half of position scaling (ruling 2026-09-02): a review verdict of
  # resolution=partial on a position in profit sells this fraction, AT MOST ONCE
  # per position (RULED 2026-09-02: once — a position re-triggering partial
  # after its trim is asked to close, not re-trimmed; the review prompt says so).
  # Whole units, rounded down; a trim that rounds to zero is skipped. Own exit
  # reason review_trim; risk-reducing, so exempt from the probation shadow.
  # Adds remain deferred as ruled. 0 disables.
  review_trim_fraction: 0.5

# SIGNAL CONVERGENCE (ruling 2026-09-01). A registry of active signals per symbol
# over a rolling window, feeding two things and only two things:
#
#   dispatch ordering  a bonus added to the scanner's dispatch weight when other
#                      independent sources are active on the name (diversity, never
#                      count) or other congressional filers disclosed purchases of
#                      it (the cross-filer cluster). ORDERING ONLY, same rule as
#                      the 2026-08-26 dispatch weight — it decides who spends
#                      limited research slots first and can never touch a cap.
#   research context   a fenced block in the research prompt: who else is active,
#                      and what this system already concluded about the name in the
#                      window — prior declines included, so a second source arriving
#                      after a decline is shown that decline.
#
# Bonus scale: the base weight is log10(amount) - age/7 (~4-7 for disclosures), so
# the caps below move a signal days of freshness up the queue, never across a class.
convergence:
  window_days: 14
  cluster_bonus_per_filer: 1.0
  cluster_bonus_cap: 3.0
  diversity_bonus_per_source: 0.5
  diversity_bonus_cap: 2.0
  max_prior_verdicts: 3

# ATR SIZING AND STOPS (ruling 2026-09-02). NEW judged EQUITY entries only: the
# stop moves from the fixed 15% to k x ATR(14)/price clamped into
# [stop_floor, stop_ceiling], and size equalizes dollar risk inside the band -
# min(band capital, band capital x risk_budget_fraction / stop). One-sided by
# arithmetic: quiet names size at the band cap (the caps stay CEILINGS),
# volatile names shade down. risk_budget_fraction 0.15 matches the old fixed
# stop, so the worst-case dollar loss per position is unchanged by this ruling.
# Options excluded (the premium is the stop; the halved table already prices
# the leverage). HELD POSITIONS KEEP THE STOPS THEY WERE OPENED WITH - INTC
# keeps its 15%. Missing ATR data falls back to the fixed-15% regime: status
# quo ante, never a fabricated volatility. The adverse review trigger becomes
# trigger_down_of_stop x the position's own stop distance, preserving the
# fire-while-a-decision-remains invariant (fixed-regime positions keep
# review_trigger.down_fraction exactly as before). ATR(14) is a SIMPLE mean of
# the last 14 true ranges over split-adjusted Alpaca daily bars - stated
# because Wilder's recursive smoothing depends on where the recursion started.
# The decision record stamps atr_fraction, stop_fraction, and the fixed-15%
# counterfactual dollars, so attribution can price the ruling either way.
atr_sizing:
  enabled: true
  k: 2.5
  stop_floor: 0.08
  stop_ceiling: 0.20
  risk_budget_fraction: 0.15
  trigger_down_of_stop: 0.66

# POST-TABLE RISK SCALARS (rulings 2026-09-01/02). ONE composition point in the
# pipeline's sizing step: size x drawdown_ladder x regime, every multiplier <=1.0
# BY VALIDATION — this section can only shrink a size, never widen one. NEW
# judged entries only: held positions, exits, the mechanical arm (never passes
# through pipeline sizing) and the cash sweep are untouched by construction.
# LLM-unreachable — no prompt or schema mentions any of it. The kill switch at
# 12% is NOT part of this ladder: the last rung deliberately stops below it, and
# the switch's own code is unchanged.
#
#   drawdown ladder  reads the gate's own drawdown() (the kill switch's number,
#                    read-only). Stateless: recovery restores the multiplier the
#                    tick the drawdown recovers. Boundaries inclusive toward
#                    less risk — at exactly 4%, 0.75 applies.
#   regime scalar    last VIX CLOSE from CBOE's free daily CSV, fetched once
#                    per UTC day. Missing/stale data runs x1.0 and is LOGGED
#                    every poll — visible, never a silent halving on an outage.
#
# Attribution renders one weekly forgone-size line (table dollars minus scaled
# dollars) so the scalars' cost/benefit is argued by data, ruled by humans.
risk_scalars:
  enabled: true
  drawdown_steps:
    - { at: 0.04, multiplier: 0.75 }
    - { at: 0.08, multiplier: 0.5 }
  regime:
    enabled: true
    thresholds:
      - { vix_at_or_above: 25, multiplier: 0.75 }
      - { vix_at_or_above: 35, multiplier: 0.5 }
    max_age_days: 7

# BOUNDARY CONFIRMATION (ruling 2026-09-02). Diagnosed live before building:
# five identical-input replays of the taken INTC boundary entry spanned
# long/38-54 and no_position/30-72 - the sizing floor's band admits stochastic
# noise, so a verdict there must REPLICATE before it sizes. A tradeable entry
# verdict with confidence in [floor, floor + band_width) buys ONE second
# independent pass (same tier, fresh context); confirmed = same direction at or
# above the floor, and the LOWER of the two confidences sizes. Disagreement or
# a failed second pass = typed rejection unconfirmed_boundary (Constraint #6:
# a verdict that does not replicate is not sized). Only floor-band candidates
# pay the extra pass. The floor itself comes from risk_limits.yaml sizing.
boundary_confirmation:
  enabled: true
  band_width: 10

# REWARD:RISK GATE (ruling 2026-09-02, from live LLM-agent trading evidence:
# expectancy discipline beats verdict accuracy). A judged EQUITY LONG must clear
# (target_price - entry) / (entry x stop_fraction) >= min_ratio before a dollar
# is sized; below it, typed rejection insufficient_reward_risk. The stop
# fraction is the one the position would actually get (ATR-derived, clamped;
# fallback_stop_fraction mirrors exits.max_loss_fraction when ATR data is
# missing). VETO-ONLY by construction: the model's target claim can block an
# entry, never enlarge one - a gamed target passes into ordinary sizing and the
# claim sits on the record to be graded. A long with no target is rejected
# (Constraint #6); a missing quote fails open because order construction
# already refuses to price without one. Options entries excluded: premium is
# the risk and the delta bands + halved table govern.
reward_risk:
  enabled: true
  min_ratio: 1.5
  fallback_stop_fraction: 0.15

# EXECUTION-FIDELITY HAIRCUT (ruling 2026-09-02). Paper fills are optimistic:
# no queue position, no adverse selection, no real spread crossing. The weekly
# report renders judged P&L both RAW and with this many basis points per fill
# side subtracted from the window's judged fill notional - a live-ish reading
# alongside the paper one. Reporting only; nothing trades on it. Fill records
# now carry intended price / spread at submission / time-to-fill, so this
# number can be argued from our own data once enough fills accumulate.
slippage_haircut_bps: 5

# MARKET DATA. Settings for the production PriceSource (execution.market_data.
# AlpacaPriceSource) — the operator passes these when wiring orchestrator.start().
market_data:
  # iex is the free feed that paper API keys grant. sip requires a paid subscription.
  feed: iex
  # A quote older than this is treated as MISSING, not used: pricing an order on a
  # stale quote is pricing it on a guess, and a missing price already has safe
  # handling everywhere (no order; skip the stop check for that symbol this tick).
  # An outage must surface as absence — never as a price of zero, which would fire
  # every max-loss stop in the book.
  max_quote_age_seconds: 300

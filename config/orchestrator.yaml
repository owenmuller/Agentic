# Orchestrator loop configuration.
#
# Nothing in this file can widen a risk limit. The caps live in risk_limits.yaml and
# are enforced downstream of everything the loop does; these values control how often
# the loop wakes up and how much research it is willing to buy in a day.

version: 1

# COST CEILING. The research layer is the only part of this system that spends money
# per signal, and a noisy day on a Class 1 feed can produce a great many signals. When
# this many passes have been bought in a day, further signals queue unresearched until
# the next day rather than being dropped — they are still there tomorrow, they are just
# not worth an unbounded spend today.
#
# Derived from the log rather than from a counter, so a restart cannot buy the budget a
# second time. See audit.log.AuditLog.research_passes_on.
max_research_passes_per_day: 40

# RESERVE FOR THE EXIT LAYER (ruling 2026-08-31). Entries may spend at most
# (1 - this) of the day's passes, so reviews of open positions can never be starved
# by a noisy entry feed. Reviews may use the whole remainder, including the entry
# share nobody claimed — the reserve is a floor under reviews, not a cap on them.
review_budget_reserve_fraction: 0.25

# COST TRIPWIRE. Same pattern as the X reads counter: when a day's cumulative
# estimated research spend (entry passes + exit reviews, rejected passes included
# because they were paid for) crosses this many dollars, ONE COST warning line is
# written to run.log — once per day, not per pass. Estimates come from the pricing
# table in research.yaml; the console bill is the truth this warns ahead of.
daily_cost_warning_usd: 10

# How often the loop wakes. Each scanner still polls on its own cadence from
# signals.yaml — this only has to be fast enough not to be the binding constraint on
# the fastest of them (Class 1, 60s).
tick_interval_seconds: 30

# cash | margin. risk_limits.yaml states `pdt.preferred_account_type: cash`, and a cash
# account cannot be a pattern day trader — it is also what structurally prevents a
# negative balance (Constraint #1). Set to `margin` only if the broker account really is
# one, which turns on day-trade counting in the risk gate below $25K equity.
account_type: cash

# EXIT LOGIC. Two layers (see src/orchestrator/exits.py):
#
#   1. Deterministic guardrails, no LLM, checked every loop cycle: a max-loss stop and
#      a time stop, both fixed per-position at entry from the defaults below. These are
#      the guarantee — they run whether or not the review layer works.
#   2. Thesis review: a periodic LLM re-research of each open position (hold/close via
#      a closed schema). Counts against max_research_passes_per_day above. A failed
#      review is a hold, never a close — the guardrails still apply regardless.
#
# Both stops resolve boundaries toward the exit (Constraint #6): a price exactly at
# the stop closes, a holding period exactly at the leash closes.
exits:
  # Close when price falls to or below entry_price x (1 - this). Per position, frozen
  # at entry. 0.15 on a 5%-of-sleeve position bounds the loss at 0.75% of the sleeve.
  max_loss_fraction: 0.15

  # FALLBACK maximum holding period, by the research report's time_horizon. The
  # PRIMARY leash source is the report's own expected_resolution_date (ruling
  # 2026-08-31); this is what a report that states no date gets. A thesis that has
  # not worked within its own stated horizon was wrong about something, whichever
  # direction price went.
  time_stop_days:
    days: 7
    weeks: 45
    months: 120

  # Bounds every leash is clamped into, whatever its source — the entry report's
  # date, a review's revision, or the fallback above. MEASURED FROM ENTRY, never
  # from the review asking: a ceiling measured from "now" is not a ceiling.
  # The months ceiling matches the mechanical arm's hold deliberately, so the
  # leash stays out of the two-arm comparison. Both moved 365 -> 367 in the same
  # ruling (2026-09-02): long-term tax treatment needs MORE than one year, trade
  # date to trade date, and 367 carries a one-day cushion over the boundary.
  leash_bounds:
    days: { floor: 3, ceiling: 21 }
    weeks: { floor: 14, ceiling: 90 }
    months: { floor: 60, ceiling: 367 }

  # How often each open position gets a thesis review. Reviews spend the daily
  # research budget, but 25% of it is reserved for them (see
  # review_budget_reserve_fraction) so entries cannot starve the exit layer.
  thesis_review_interval_hours: 24

  # A price move that forces a review out of cadence. The trigger sets a flag and
  # nothing else — it never closes a position. Asymmetric on purpose: a downside
  # trigger at the 15% stop distance would fire in the same cycle the stop closes
  # the position, so it sits tighter and asks "is the thesis dead?" while there is
  # still a decision to make. Debounced from the last review's price.
  review_trigger:
    up_fraction: 0.15
    down_fraction: 0.10
    max_per_day: 5

  # The trailing backstop beneath the review layer. Arms only after a gain that has
  # already happened, then follows the position's high-water mark and never falls.
  # Not a profit target: it cannot fire on a position that has not first run.
  ratchet:
    arm_at_gain: 0.20
    trail_fraction: 0.10

# SIGNAL CONVERGENCE (ruling 2026-09-01). A registry of active signals per symbol
# over a rolling window, feeding two things and only two things:
#
#   dispatch ordering  a bonus added to the scanner's dispatch weight when other
#                      independent sources are active on the name (diversity, never
#                      count) or other congressional filers disclosed purchases of
#                      it (the cross-filer cluster). ORDERING ONLY, same rule as
#                      the 2026-08-26 dispatch weight — it decides who spends
#                      limited research slots first and can never touch a cap.
#   research context   a fenced block in the research prompt: who else is active,
#                      and what this system already concluded about the name in the
#                      window — prior declines included, so a second source arriving
#                      after a decline is shown that decline.
#
# Bonus scale: the base weight is log10(amount) - age/7 (~4-7 for disclosures), so
# the caps below move a signal days of freshness up the queue, never across a class.
convergence:
  window_days: 14
  cluster_bonus_per_filer: 1.0
  cluster_bonus_cap: 3.0
  diversity_bonus_per_source: 0.5
  diversity_bonus_cap: 2.0
  max_prior_verdicts: 3

# MARKET DATA. Settings for the production PriceSource (execution.market_data.
# AlpacaPriceSource) — the operator passes these when wiring orchestrator.start().
market_data:
  # iex is the free feed that paper API keys grant. sip requires a paid subscription.
  feed: iex
  # A quote older than this is treated as MISSING, not used: pricing an order on a
  # stale quote is pricing it on a guess, and a missing price already has safe
  # handling everywhere (no order; skip the stop check for that symbol this tick).
  # An outage must surface as absence — never as a price of zero, which would fire
  # every max-loss stop in the book.
  max_quote_age_seconds: 300

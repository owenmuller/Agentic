# Orchestrator loop configuration.
#
# Nothing in this file can widen a risk limit. The caps live in risk_limits.yaml and
# are enforced downstream of everything the loop does; these values control how often
# the loop wakes up and how much research it is willing to buy in a day.

version: 1

# COST CEILING. The research layer is the only part of this system that spends money
# per signal, and a noisy day on a Class 1 feed can produce a great many signals. When
# this many passes have been bought in a day, further signals queue unresearched until
# the next day rather than being dropped — they are still there tomorrow, they are just
# not worth an unbounded spend today.
#
# Derived from the log rather than from a counter, so a restart cannot buy the budget a
# second time. See audit.log.AuditLog.research_passes_on.
max_research_passes_per_day: 40

# How often the loop wakes. Each scanner still polls on its own cadence from
# signals.yaml — this only has to be fast enough not to be the binding constraint on
# the fastest of them (Class 1, 60s).
tick_interval_seconds: 30

# cash | margin. risk_limits.yaml states `pdt.preferred_account_type: cash`, and a cash
# account cannot be a pattern day trader — it is also what structurally prevents a
# negative balance (Constraint #1). Set to `margin` only if the broker account really is
# one, which turns on day-trade counting in the risk gate below $25K equity.
account_type: cash

# EXIT LOGIC. Two layers (see src/orchestrator/exits.py):
#
#   1. Deterministic guardrails, no LLM, checked every loop cycle: a max-loss stop and
#      a time stop, both fixed per-position at entry from the defaults below. These are
#      the guarantee — they run whether or not the review layer works.
#   2. Thesis review: a periodic LLM re-research of each open position (hold/close via
#      a closed schema). Counts against max_research_passes_per_day above. A failed
#      review is a hold, never a close — the guardrails still apply regardless.
#
# Both stops resolve boundaries toward the exit (Constraint #6): a price exactly at
# the stop closes, a holding period exactly at the leash closes.
exits:
  # Close when price falls to or below entry_price x (1 - this). Per position, frozen
  # at entry. 0.15 on a 5%-of-sleeve position bounds the loss at 0.75% of the sleeve.
  max_loss_fraction: 0.15

  # Maximum holding period, chosen by the research report's time_horizon at entry.
  # A thesis that has not worked within its own stated horizon is a thesis that was
  # wrong about something, whichever direction price went.
  time_stop_days:
    days: 7
    weeks: 45
    months: 120

  # How often each open position gets a thesis review. Reviews spend the daily
  # research budget; entries are processed first each tick, so a tight budget starves
  # reviews before it starves entries.
  thesis_review_interval_hours: 24

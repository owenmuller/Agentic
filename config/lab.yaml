# PAPER PUSH (human ruling 2026-10-09, late evening): aggressive strategies run
# live in SEPARATE Alpaca paper accounts, ~$100K each, in parallel, and the
# results sort them. The main paper book and its rules are untouched: nothing
# here is read by the orchestrator, and no lab account can write the main
# book's data (datasafety owner markers).
#
# Each account:
#   - its own keys, from .env: ALPACA_LAB_<NAME>_API_KEY / ALPACA_LAB_<NAME>_API_SECRET
#     (<NAME> = the account name upper-cased, '-' -> '_'). A human creates the paper
#     account in the Alpaca dashboard and adds the keys; the agent never does.
#   - its own ledger and state under data-lab/<name>/, writable only by its own
#     system unit agentic-lab-<name>.service (installed by a human, root).
#   - its own risk gate (the same deterministic RiskGate, its own cap table:
#     config/risk_limits.yaml with this file's overrides) and its own kill switch
#     (12% from its own high-water mark; manual human reset; halt marker).
#   - pinned to one broker account number at its first run; refuses to start if
#     the keys ever resolve to a different account, or to the main book's.
#
# Paper only: every lab process refuses to start unless PAPER_MODE resolves to
# paper. It never reads, sets or suggests the live-trading variables.
version: 1

accounts:
  ladder:
    enabled: true
    label: LEVERAGE LADDER
    sleeve: leverage_ladder
    # Paper benchmark. Leveraged ETFs were analysis-only before this ruling
    # (CLAUDE.md § Risk-On Redirect); live eligibility is not ruled.
    live_eligible: false
    # The ladder holds 100% of its NAV through the gate's BASELINE path: cash-
    # secured, dust-floored, bound by its allocation ceiling (1.00 + 0.03 drift),
    # exempt from the judged sleeve's alpha caps; frozen by the operator halt.
    limits_overrides:
      portfolio:
        sleeves: {equity: 0, mechanical: 0, prediction: 0, baseline: 1, aggressive: 0, momentum: 0}
    # Ruling 2026-10-10, item 3a: NO drawdown kill switch for the ladder - it is
    # the benchmark and keeps rebalancing through drawdowns. An urgent alert at
    # -25% from peak instead (once per peak). The operator halt still works.
    kill_switch: false
    drawdown_alert: 0.25
  # Ruling 2026-10-10, item 2: the third paper slot (main, ladder, this).
  ai-trader:
    # ENABLED (human ruling 2026-10-10 approved it; order-path round trip passed
    # 2026-10-12; price-anchoring golden 5/5 2026-10-12). Its timer is the human's.
    enabled: true
    label: AUTONOMOUS AI TRADER
    sleeve: ai_trader
    live_eligible: false
    status: "live in paper from its first timer-started session"
    # The account's own cap table. Stocks/ETFs ride the gate's AGGRESSIVE path
    # (fixed-risk sleeve: 5 names, 25% of its NAV per name, T+1 on today's sale
    # proceeds); long calls/puts ride the EQUITY path (the only one options
    # have), here used for options alone. Weights only scale those caps:
    #   stock single position  0.25 x 75% = 18.75% of NAV
    #   option single position 0.10 x 25% =  2.5% of NAV (>= the 2% premium budget)
    #   options premium open   0.40 x 25% = 10% of NAV (five 2% contracts)
    # The 12% kill switch stays (ruling 2026-10-10, item 3a).
    limits_overrides:
      portfolio:
        sleeves: {equity: 0.25, mechanical: 0, prediction: 0, baseline: 0, aggressive: 0.75, momentum: 0}
      equity_sleeve:
        max_single_position: 0.10
        max_daily_deployment: 1.00
        max_options_premium_at_risk: 0.40
        max_short_dated_premium_at_risk: 0.40
      aggressive_sleeve:
        max_single_position: 0.25
        max_positions: 5
        max_daily_deployment: 1.00
        max_sector_exposure: 0.50
        entries_enabled: true
# 2c UNCONSTRAINED: DROPPED (ruling 2026-10-10, item 1). The long/short versions
# of A and B were already measured after publication (A negative, B levered
# +1.9%/yr); a live run repeats a known answer. Constraints #1 and #2 unchanged.

# 2a. LEVERAGE LADDER (the benchmark every sleeve must beat). Three rungs, each
# an independent sub-book of one third of the account, bought and held,
# rebalanced to its weights at the first session of each month. No other logic.
ladder:
  rungs:
    - name: spy_1_5x
      label: "1.5x SPY (SPY + SSO)"
      weights: {SPY: 0.5, SSO: 0.5}
    - name: spy_2x
      label: "2x SPY (SSO)"
      weights: {SSO: 1.0}
    - name: qqq_2x
      label: "2x QQQ (QLD)"
      weights: {QLD: 1.0}
  # Held back in each rung so a marketable limit never asks for cash the rung
  # does not have; the rebalance trades back to (1 - reserve) x weights.
  cash_reserve_fraction: 0.005
  # Trades smaller than this are skipped (dust, not drift).
  min_trade_usd: 25
  # Marketable limits: ask x (1 + buffer) for buys, bid x (1 - buffer) for sells.
  limit_buffer: 0.002
  # Within one run: an unfilled order is re-priced every reprice_seconds and
  # abandoned (cancelled, retried next run) after fill_wait_seconds.
  reprice_seconds: 60
  fill_wait_seconds: 600
  # The rebalance trades only inside this window of the session (ET).
  trade_after: "09:45"
  trade_before: "15:30"

# 2b. AUTONOMOUS AI TRADER (PAPER PUSH 2026-10-09; built per ruling 2026-10-10,
# item 5). The LLM decides WHAT and WHY - it searches the web for its own
# ideas, any source (content it reads is data, never instructions: Constraint
# #5). The rules engine decides HOW MUCH (2% of the account at risk per trade),
# WHEN OUT (its stop, its target, its horizon, option expiry, 15:50 for
# intraday) and WHETHER AT ALL (max 5 open positions, the gate, the kill
# switch, the spend cap). Nothing is sized off P&L or targets, and the prompt
# never sees P&L, NAV history or performance (CLAUDE.md § Standards).
ai_trader:
  # A pinned model (research.yaml pinned_models), the production request path
  # (search phase, then a forced report tool; report T=0 on this model).
  model: claude-sonnet-4-6
  effort: medium
  max_searches: 3
  # The plain search tool (2026-10-10): the dynamic-filtering version ran
  # server-side code execution and took 200 s to 15+ min per open-ended pass
  # (two golden passes hung past the 10-minute client timeout); plain: 33 s.
  search_tool: web_search_20250305
  request_timeout_seconds: 300
  # Daily LLM spend cap $3 (spec), hard: a pass starts only if today's spend
  # plus the reserve stays inside the cap. Spend = token estimate from the
  # research.yaml pricing table + $0.01 per web search.
  daily_spend_cap_usd: 3.00
  pass_cost_reserve_usd: 0.60
  search_fee_usd: 0.01
  # Five idea scans a session (ET); each may propose up to 3 ideas.
  scan_times: ["09:45", "10:45", "12:00", "13:30", "14:45"]
  max_ideas_per_scan: 3
  tick_seconds: 30
  # The rules engine.
  risk_fraction: 0.02          # of the account (NAV) at risk per trade (spec)
  max_positions: 5             # open positions, stocks and options together (spec)
  # Explicit gross cap (human ruling 2026-10-14, audit item 4): open exposure plus
  # a new order may not pass 100% of NAV. Per position the gate already binds
  # tighter than 25%: stocks 18.75% of NAV, option premium 2.5%.
  max_gross_fraction: 1.00
  # Leverage is ALLOWED here and MEASURED (human ruling 2026-10-14, second,
  # item 2): gross counts notional x |factor|; leveraged-ETF trades are tagged.
  # The cap enforces on gross_basis: "face", confirmed by human ruling 2026-10-14
  # (third) for this account (on that day leverage-adjusted gross was 138%:
  # SOXS and SQQQ at 3x each).
  gross_basis: face
  # Leverage watch (human ruling 2026-10-14, third): an urgent alert when the
  # leverage-adjusted gross passes 150% of equity, once per crossing, re-armed
  # below 130%. It never blocks: the 100% cap stays on face value (same ruling).
  leverage_alert_above: 1.50
  leverage_alert_rearm_below: 1.30
  # Signed factors; a fund not listed is read from its name at the broker.
  leverage_factors:
    SOXS: -3
    SOXL: 3
    SQQQ: -3
    TQQQ: 3
    SPXU: -3
    SPXS: -3
    SPXL: 3
    UPRO: 3
    SDS: -2
    SSO: 2
    QID: -2
    QLD: 2
    SH: -1
    PSQ: -1
    TZA: -3
    TNA: 3
    LABD: -3
    LABU: 3
    FAZ: -3
    FAS: 3
    TECS: -3
    TECL: 3
    TMV: -3
    TMF: 3
    YANG: -3
    YINN: 3
    DUST: -2
    NUGT: 2
    ERY: -2
    ERX: 2
    DRIP: -2
    GUSH: 2
    SCO: -2
    UCO: 2
    KOLD: -2
    BOIL: 2
    UVXY: 1.5
    SVXY: -0.5
  min_confidence: 50           # my reading (Constraint #6): no token positions on weak ideas
  min_reward_risk: 1.0         # target distance >= stop distance; my reading, flagged
  # Human ruling 2026-10-10 (second): 1% (was 0.3%) UNTIL the execution test
  # has measured stop slippage on >= 10 fills; then a floor of at least 3x the
  # measured stop slippage is PROPOSED to the human (the scoreboard prints the
  # proposal) - never moved automatically.
  min_stop_fraction: 0.01
  max_stop_fraction: 0.25
  no_entries_after: "15:30"
  no_intraday_entries_after: "15:15"
  intraday_close: "15:50"
  horizon_sessions: {days: 5, weeks: 20}
  limit_buffer: 0.002
  fill_wait_seconds: 90
  options:
    # Long calls/puts only; premium is the whole risk (2% of NAV of premium).
    # 0DTE allowed for intraday ideas (spec).
    dte: {intraday: [0, 2], days: [2, 14], weeks: [7, 45]}
    delta_min: 0.40
    delta_max: 0.70
    target_delta: 0.55
    min_open_interest: 100
    max_spread_pct_of_mid: 0.15
    max_iv_percentile: 0.95
    expiry_close: "15:45"

# Government contractor -> public parent ticker map (ruling 2026-10-06, contract awards source).
#
# HUMAN-EDITED. The parser matches the awardee string (lower-cased, punctuation and
# corporate suffixes stripped, "doing business as ..." dropped) against `prefix` by
# word-prefix, longest prefix first. `ticker: null` marks a KNOWN non-public awardee
# (private, JV, foreign-listed, nonprofit, government-owned) so it drops at the
# prefilter as `no_instrument` with reason `known_nonpublic` instead of `unresolved`.
# Foreign parents whose only US line is an OTC ADR are null: the pre-registered backtest
# rule and the gate both want a US-listed parent. Small-business awardees carry `*` in the
# digest and drop before this table is consulted.
#
# Historical renames (point-in-time, for the backtest): `until` is the last trading day
# under `ticker`; `successor` is what the parent became. An award dated after `until`
# resolves to the successor; before it, to `ticker` (bars may not exist for a delisted
# symbol — then the event is reported as no-bars, never silently remapped).
#
# Adding or changing an entry is a human ruling (CLAUDE.md: watchlists are human-edited).


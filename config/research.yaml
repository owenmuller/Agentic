# Research layer configuration.
#
# The model is configurable here. Nothing in this file can affect position sizing or
# risk-gate behaviour — those live in risk_limits.yaml and are enforced downstream of
# anything the research layer produces.

version: 1

# Claude model used for the research pass.
model: claude-opus-5

# Output ceiling for a single research call.
max_tokens: 8000

# Thinking depth / token spend: low | medium | high | xhigh | max.
effort: high

web_search:
  # CLAUDE.md § Research: "Research may use web search to pressure-test the thesis."
  enabled: true
  # Cost reduction 2026-08-20: 2, down from 5. Search payloads were the dominant
  # input cost (79K-119K tokens/pass observed 2026-08-19).
  max_uses: 2
  # Whether the raw search-result blocks are replayed into the report phase.
  # False (default): the report phase sees the model's own written analysis from
  # the search phase, with the opaque result payloads elided and an explicit
  # marker saying so. Per Anthropic's docs (verified 2026-08-20), result content
  # is encrypted and MUST be replayed byte-identical or the request 400s — so
  # per-result truncation is impossible by API contract; elision-with-marker is
  # the honest implementable form of a payload budget. True restores full replay.
  replay_results_in_report: false

# How many times a search phase may be resumed after the server-side tool loop pauses.
# Bounds the evidence-gathering phase; the report phase always runs exactly once.
max_search_continuations: 3

# TRIAGE GATE (cost reduction 2026-08-20). One cheap forced-tool call before any
# full research pass: "does this signal contain a plausibly tradeable, verifiable,
# non-stale thesis?" No -> stage_rejection code "triage" (~$0.02), full pass never
# invoked. Yes -> proceeds exactly as before; nothing the triage model returns has
# any authority beyond the yes/no. Counts toward the daily COST meter, NOT the
# 40-pass research budget. A triage failure (outage, malformed output) FAILS OPEN
# to the full pass - a broken gate must not silently stop the research layer.
triage:
  model: claude-haiku-4-5-20251001
  max_tokens: 200

# Two-stage research (cost architecture 2026-08-25): every full pass screens on
# Sonnet first. no_position or confidence < 55 ends there (rejections get
# cheap); an actionable report graduates to the source-tier verification pass
# with the screen draft as context. No trade sizes on a single unverified pass.
screen:
  model: claude-sonnet-4-6
  effort: medium
  max_searches: 1
  graduation_confidence: 55

# Per-class model tiers (cost-efficiency pass, 2026-08-19). Class 1 is the only
# latency class where speed is genuine edge and the only one that inherits the
# flagship model above (no override = top-level model/effort). Class 2 and 3 carry
# 45-day disclosure lags and the exit review re-reads an already-formed thesis —
# none of them needs the flagship. The report schema and every validation gate are
# identical across tiers; only the model and effort change.
tiers:
  # Search budgets by class (2026-08-25): class_1 verification inherits the
  # global web_search.max_uses (2 — it carries the verification burden); the
  # lagged classes and exit reviews cap at 1.
  class_2:
    model: claude-sonnet-4-6
    effort: medium
    max_searches: 1
  class_3:
    model: claude-sonnet-4-6
    effort: medium
    max_searches: 1
  exit_review:
    model: claude-sonnet-4-6
    effort: medium
    max_searches: 1

# Cost estimates, dollars per million tokens. BASELINE NUMBERS — to be replaced
# with real console figures after week one of the paper period. A model missing
# from this table records no estimate (None), never a guessed one.
pricing:
  claude-opus-5:
    input_per_mtok: "15.00"
    output_per_mtok: "75.00"
  claude-sonnet-4-6:
    input_per_mtok: "3.00"
    output_per_mtok: "15.00"
  claude-haiku-4-5-20251001:
    input_per_mtok: "1.00"
    output_per_mtok: "5.00"

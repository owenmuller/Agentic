# DISPATCH PRIORS (AGGRESSION RULING 2026-09-18, step 2 as revised).
#
# One unit everywhere: expected 5-day excess return over SPY, in percentage
# points. The dispatch score is  prior(slice) - age_days/7 + convergence bonus,
# and the 40 daily research slots go to the highest scores across ALL sources
# (per-source caps stay as ceilings; the class pools stay).
#
# GROUNDING: `python -m orchestrator priors` computes every slice's mean forward
# excess from the forward-return engine over every funnel record - researched or
# capped - and `--write` replaces a slice's value here ONLY where n >= min_n,
# marking it `grounded: true` with its n. Everything else is a RULED DEFAULT
# (`grounded: false`) and says so. A human reviews and commits the result: data
# argues, humans rule, rulings are dated. Slices the forward engine has not yet
# resolved (8-K items: first candidates 2026-09-16, no 5d marks yet) keep the
# ordering the ruling gave them - 5.02 executive change and 1.05 cyber ahead of
# 1.01 material agreement - until the data can speak.
#
# ORDERING ONLY. Nothing here sizes a position or widens a cap.
version: 1
horizon_days: 5
min_n: 20
# One week of report age costs one point (the 2026-08-26 equivalence).
freshness_points_per_day: 0.142857
generated_at: "2026-09-18 (ruled defaults; first grounding pass pending the forward refresh)"

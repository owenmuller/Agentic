- id: nct_decline_right
  why: declined a collapsing micro-cap; it fell a further 66 points against SPY as the named impairment said
  case:
    decision_id: aa5fbee02efb4604
    account: main
    strategy: judged
    kind: decline
    symbol: NCT
    opened: '2026-09-25'
    resolved: '2026-10-15'
    direction: long
    thesis: 'NCT (Intercont (Cayman) Ltd) presents no credible tradeable thesis. The stock has collapsed 99.4% from its 52-week
      high of $981.25 to a last close of $5.83, sits 93.7% below its 200-day moving average for 62+ consecutive sessions,
      and declined a further 94.4% over the prior 20 days and 32% over the prior 5 days. Zero volume was recorded on the observation
      date against a 20-day average of ~3,493 shares — the market has effectively ceased normal trading in this name. The
      CEO and Chairman (Zhu Muchun) filed a same-day Form 4 disclosing an open-market purchase of 1,625,000 shares for $650,000.
      The CEO role is seniority-relevant, but the purchase cannot be interpreted as a signal of unpriced value because: (a)
      the catastrophic move has already occurred across all lookback windows; (b) no identifiable catalyst explains what the
      insider may see that is not already priced in; (c) the implied per-share transaction price (~$0.40, derived from $650,000
      / 1,625,000) is arithmetically inconsistent with the reported last close of $5.83, which is itself unexplained and undermines
      data integrity; (d) the company is Cayman-domiciled, a structural flag for opaque governance; and (e) this price/volume
      pattern is consistent with the aftermath of a manipulated structure or fraud, not a temporary dislocation. No earnings
      data is configured. No verifiable fundamental basis exists for a recovery thesis. Source track record: no resolved outcomes
      — no confidence basis to credit. No position is the correct verdict at high confidence.'
    expected: 'declined (no position): verdict no_position at confidence 90, horizon weeks'
    actual: NCT returned -66.21% over the 20 sessions after the decision (-66.26 points against SPY)
    return_pct: -66.21

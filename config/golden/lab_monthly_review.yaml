  rules: '- 5 scans a session at 09:45, 10:45, 12:00, 13:30, 14:45 ET; up to 3 ideas a scan; at most 5 open positions

    - confidence at least 50; stop 1%-25% from entry; target at least 1.0 x the stop; risk 2% of NAV a trade

    - no intraday entry after 15:15 ET, no entry after 15:30 ET; intraday out at 15:50; days 5 sessions, weeks 20

    - options: expiry windows {''intraday'': (0, 2), ''days'': (7, 14), ''weeks'': (7, 45)} days; |delta| 0.4-0.7; open interest
    >= 100; spread <= 0.15

    - stops and targets read the quote rule: the mid only within a 2% spread; a long''s stop on a tight bid, else the last
    trade; never a wide quote''s mid (2026-11-12)

    - one bet per sector or theme: no new position in a sector or theme already held or already placed earlier in the same
    scan (''other'' exempt by theme); at most 1 new option(s) a scan (2026-11-12)

    - logged only, no live effect yet: the move since the catalyst went public, and its skip-above-1-ATR shadow

    - the live mirror copies every paper entry it can fund on settled cash; no leveraged or inverse funds live; an option
    that does not fit the live premium cap is copied as its underlying (calls) or skipped (puts)'
